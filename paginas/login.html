<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
            body {
            font-family: "Montserrat", sans-serif;
            background-color: rgb(230, 226, 182);
        }
        .letraBranca {
            color: rgba(255, 255, 255, 0.85);
        }

        .letraPreta {
            color: black;

        }

        .letraBrancaEmNegrito {
            color: rgba(255, 255, 255, 0.85);
        }

        .bg-dark-custom {
            background-color: #1b2530;
        }

        .bg-input {
            background-color: #252b33;
            border-color: #a50ee0;
        }
    </style>
</head>

<body style="background-color: rgb(155, 145, 4);">
    <main class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <aside class="col-lg-7 d-none d-lg-block">
                <img src="/imagens/santaLolaLogin.jpg"
                        alt=""
                        class="w-100 h-91 object-fit-cover">
            </aside>
            <section class="col-12 col-lg-5 d-flex align-items-center justify-content-center">
                <div class="w-100 px-4" style="max-width: 420px; padding: 40px; border-radius: 8px;">
                    <header class="mb-4 text-center">
                        <img src="/imagens/logoSantaLola.png"
                                alt="Logo Santa Lola"
                                style="height: 90px;">
                    </header>
                    <form>
                        <div class="mb-6">
                            <label for="emailInput" class="form-label letraPreta">
                                E-mail
                            </label>
                            <input type="email"
                                    id="emailInput"
                                    class="form-control letraPreta"
                                    placeholder="Seu email"
                                    required>
                        </div>
                        <div class="mb-6 mt-4">
                            <label for="passwordInput" class="form-label letraPreta">
                                Senha
                            </label>
                            <input type="password"
                                    id="passwordInput"
                                    class="form-control letraPreta"
                                    placeholder="Sua senha"
                                    required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit"
                                    class="btn text-black letraPreta"
                                    style="background-color: #573d0d; border-color: #573d0d;">
                                Acessar minha conta
                            </button>
                        </div>
                    </form>
                    <footer class="text-center mt-5 text-secondary" style="font-size: 0.875rem;">
                        Não tem uma conta?
                        <a href="#" class="link-rocket text-decoration-underline" style="color: #5a5403;" data-bs-toggle="modal" data-bs-target="#modalRegistro">Registre-se</a>
                    </footer>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-labelledby="modalRegistroLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1b2530; border: 1px solid #333;">
                
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold fs-4 letraBranca" id="modalRegistroLabel">Registre-se</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                
                <div class="modal-body px-4 pb-5">
                    <form>
                        <div class="mb-3">
                            <label for="nomeCadastro" class="form-label letraBranca">Nome completo</label>
                            <input type="text" class="form-control form-control-dark letraPreta bg-input" id="nomeCadastro" placeholder="Seu nome" style="background-color: antiquewhite;">
                        </div>
                        <div class="mb-3"> 
                            <label for="emailCadastro" class="form-label letraBranca">E-mail</label>
                            <input type="email" class="form-control form-control-dark letraPreta bg-input" id="emailCadastro" placeholder="Seu email" style="background-color: antiquewhite;">
                        </div>
                        <div class="mb-3">
                            <label for="senhaCadastro" class="form-label letraBranca">Senha</label>
                            <input type="password" class="form-control form-control-dark letraPreta bg-input" id="senhaCadastro" placeholder="Sua senha" style="background-color: antiquewhite;">
                        </div>
                        <div class="d-grid mt-4"> 
                            <button type="submit" class="btn text-white letraPreta" style="background-color:#5a5403; border-color: #5a5403;">Cadastrar</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
