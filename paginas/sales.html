<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Sua Loja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        /* Aplica a fonte no site todo para limpar o HTML */
        body {
            font-family: "Montserrat", sans-serif;
            background-color: rgb(230, 226, 182);
        }

        .img-carrossel {
            height: 100%;
            width: 100%;
            object-fit: contain;
            background-color: rgb(255, 255, 255);
        }

        .letraPreta {
            color: black !important;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .letraPreta:hover {
            color: rgb(61, 57, 4) !important; 
        }

        .img-card-padrao {
            height: 250px; 
            width: 100%; 
            object-fit: contain; 
            background-color: #ffffff; 
            padding: 15px; 
            border-top-left-radius: 8px; 
            border-top-right-radius: 8px;
        }

        
        .card-produto {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(17, 14, 14, 0.05); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-produto:hover {
            transform: translateY(-5px); 
            box-shadow: 0 10px 15px rgba(0,0,0,0.1); 
        }
        .linha-imagens {
            display: flex;                 
            gap: 5px;                    
        }

        .linha-imagens img {
            max-width: 100%;              
            height: auto;
            width: 535px;                 
            }

    </style>
</head>
<body>

            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
                <li class="nav-item">

                </li>
                <li class="nav-item">
                <a class="nav-link" href="/paginas/login.html">Login</a>

                    <li><a class="dropdown-item" href="/paginas/bolsas.html">Bolsas</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item fw-bold text-danger" href="/paginas/sale.html">Sale</a></li>
                </ul>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2 border-0" type="search" placeholder="Buscar..." aria-label="Search"/>

            </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-0">
        <div id="carrosselProdutos" class="carousel slide" data-bs-ride="carousel" style="height: 50vh; width: 100%;">
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carrosselProdutos" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carrosselProdutos" data-bs-slide-to="1" aria-label="Slide 2"></button>
            </div>

            <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                    <img src="/imagens/lolinha.JPG" class="img-carrossel" alt="lola">
                </div>
                <div class="carousel-item h-100">
                    <img src="/imagens/lola.jpg" class="img-carrossel" alt="lola">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carrosselProdutos" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrosselProdutos" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </div>


            <div class="col d-flex justify-content-center">

                        <a href="#" class="btn w-100 fw-bold" style="background-color: rgb(61, 57, 4); color: rgb(241, 236, 236);">Comprar</a>
